name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint • Test • Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci || npm install
        env:
          NODE_ENV: development

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          NODE_ENV: test
          MASTER_KEY: ${{ secrets.MASTER_KEY_TEST || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
        run: npm test

      - name: Audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: super-data-extractor:ci
